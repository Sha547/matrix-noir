# matrix-noir kitty config  ·  https://github.com/Sha547/matrix-noir

# --- Font ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# --- Window ---
background_opacity 0.88
background_blur    32
dynamic_background_opacity yes
window_padding_width 10 14
hide_window_decorations no
confirm_os_window_close 0

# --- Cursor ---
cursor_shape beam
cursor_beam_thickness 2
cursor_blink_interval 0.6 ease-in-out
cursor_stop_blinking_after 0
cursor_trail 1
cursor_trail_decay 0.08 0.35
cursor_trail_start_threshold 1
cursor_trail_color #3FB950

# --- Bell: animated green flash instead of a beep ---
enable_audio_bell no
visual_bell_duration 0.35 ease-out
visual_bell_color #3FB950
window_alert_on_bell yes

# --- Long commands: desktop notification when a 10s+ command finishes and kitty isn't focused ---
notify_on_cmd_finish unfocused 10.0

# --- Tab bar ---
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{index}: {title}"
active_tab_font_style bold

# --- Show-off hotkeys: open as an overlay on the current window, quit to return ---
# Child processes get matrix-noir's commands, ~/.local/bin, snaps and /usr/games on PATH
env PATH=${HOME}/.local/share/matrix-noir/bin:${HOME}/.local/bin:/snap/bin:/usr/games:${PATH}
map ctrl+alt+m launch --type=overlay sh -c "exec matrix"
map ctrl+alt+s launch --type=overlay sh -c "exec showoff"
map ctrl+alt+b launch --type=overlay sh -c "exec btop"
map ctrl+alt+a launch --type=overlay sh -c "exec asciiquarium"
map ctrl+alt+j launch --type=overlay sh -c "exec cbonsai -li"

# --- Misc ---
scrollback_lines 10000
copy_on_select yes

# --- Noir v2 (coder palette: almost-black, grey text, matrix-green accent, no purple) ---
foreground              #C8D3CA
background              #050806
selection_foreground    #050806
selection_background    #3FB950
cursor                  #7EE787
cursor_text_color       #050806
url_color               #56D4DD
url_style               curly
active_border_color     #3FB950
inactive_border_color   #1C2620
active_tab_foreground   #050806
active_tab_background   #3FB950
inactive_tab_foreground #5F6E63
inactive_tab_background #0C110D
tab_bar_background      #050806
mark1_background        #3FB950
color0  #0C110D
